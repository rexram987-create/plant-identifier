name: Build ornamental plants index

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ornamental-plants-index.yml"
      - "scripts/extract_ornamental_plants.py"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor dependency
        run: pip install pdfplumber==0.11.4

      - name: Download official Ministry PDF
        run: |
          curl --fail --location             "https://www.gov.il/BlobFolder/reports/list-of-ornamental-plants-ini-srael/he/Professional_information_books_list-of-ornamental-plants-ini-srael.pdf"             --output ornamental-plants.pdf

      - name: Extract and cross-check both indexes
        run: |
          python scripts/extract_ornamental_plants.py             ornamental-plants.pdf             android/app/src/main/assets/ornamental_plants.json

      - name: Commit generated index
        run: |
          if git diff --quiet -- android/app/src/main/assets/ornamental_plants.json android/app/src/main/assets/ornamental_plants.report.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/assets/ornamental_plants.json android/app/src/main/assets/ornamental_plants.report.json
          git commit -m "Generate full ornamental plants index"
          git push
