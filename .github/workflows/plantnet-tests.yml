name: PlantNet integration tests

on:
  push:
    branches:
      - feature/plantnet-image-identification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PlantNet proxy contract
        run: node tests/plantnet-api.test.js
      - name: PlantNet browser client contract
        run: node tests/plantnet-client.test.js
      - name: PlantNet app integration contract
        run: node tests/plantnet-app-integration.test.js

      - name: Mobile-safe local engine contract
        run: node tests/mobile-safe-image-engine.test.js
