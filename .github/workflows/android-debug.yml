name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - feature/android-native
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore OpenPlants model cache
        id: openplants-cache
        uses: actions/cache/restore@v4
        with:
          path: models/openplants
          key: openplants-int8-dynamic-v2

      - name: Verify and bundle OpenPlants model
        run: |
          test -s ../models/openplants/model-int8.onnx
          test -s ../models/openplants/labels.json
          mkdir -p app/src/main/assets/openplants
          cp ../models/openplants/model-int8.onnx app/src/main/assets/openplants/model-int8.onnx
          cp ../models/openplants/labels.json app/src/main/assets/openplants/labels.json
          ls -lh app/src/main/assets/openplants

      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: plant-identifier-android-debug-keystore-v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plant-identifier-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
