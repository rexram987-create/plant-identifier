name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/android-native
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore OpenPlants model cache
        id: openplants-cache
        uses: actions/cache/restore@v4
        with:
          path: models/openplants
          key: openplants-int8-dynamic-v2

      - name: Verify and bundle OpenPlants model
        run: |
          test -s ../models/openplants/model-int8.onnx
          test -s ../models/openplants/labels.json
          mkdir -p app/src/main/assets/openplants
          cp ../models/openplants/model-int8.onnx app/src/main/assets/openplants/model-int8.onnx
          cp ../models/openplants/labels.json app/src/main/assets/openplants/labels.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare stable signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_DATA" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$RUNNER_TEMP/plant-identifier-release.jks"
          test -s "$RUNNER_TEMP/plant-identifier-release.jks"

      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Build stable signed APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/plant-identifier-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload pull request APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: plant-identifier-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload stable signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: plant-identifier-android-stable
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
