<!doctype html>
<meta charset="utf-8">
<title>Israel plant name search tests</title>
<script src="../local-name-search.js"></script>
<pre id="results"></pre>
<script>
(async () => {
  const cases = [
    ['אלה אטלנטית', 'Pistacia atlantica'],
    ['אלה ארץ-ישראלית', 'Pistacia palaestina'],
    ['אלון התבור', 'Quercus ithaburensis'],
    ['הרדוף הנחלים', 'Nerium oleander'],
    ['זית אירופי', 'Olea europaea'],
    ['חרוב מצוי', 'Ceratonia siliqua']
  ];
  const lines = [];
  let failures = 0;

  if (typeof window.PlantNameSearch.syncAgricultureNames !== 'function') {
    failures++;
    lines.push('FAIL syncAgricultureNames is missing');
  } else {
    const synced = await window.PlantNameSearch.syncAgricultureNames();
    const actual = await window.PlantNameSearch.resolveLocalName('חרציתן מאפיר', 'he');
    const ok = synced > 400 && actual === 'Chrysanthemoides incana';
    if (!ok) failures++;
    lines.push(`${ok ? 'PASS' : 'FAIL'} DataGov sync: ${synced} names; חרציתן מאפיר => ${actual || 'null'}`);
  }

  for (const [name, expected] of cases) {
    const actual = await window.PlantNameSearch.resolveLocalName(name, 'he');
    const ok = actual === expected;
    if (!ok) failures++;
    lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}: ${actual || 'null'} (expected ${expected})`);
  }
  document.getElementById('results').textContent = lines.join('\n');
  document.title = failures ? `FAIL ${failures}` : 'PASS';
})();
</script>
